<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phụ liệu trang trí - Tiệm Len Handmade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Nạp Header dùng chung -->
    <div id="header-placeholder"></div>
    <div id="category-placeholder"></div>
    <main class="content">
        <div class="container">
            <h1 class="category-title">Phụ liệu trang trí</h1>        
            <div class="product-grid">
                <!-- Sản phẩm 15 -->
                <div class="product-card">
                    <img src="images/hop-mat-thu-bong.jpg" id="main-img-15" alt="Sản phẩm">
                    <h3>Hộp mắt thú bông nhiều màu </h3>
                    <p class="price">153.000đ</p>
                    <button id="btn-15" class="btn-buy" onclick="location.href='detail.html?id=15&color=default'">Xem chi tiết</button>
                </div>
                <!-- Sản phẩm 16 -->
                <div class="product-card">
                    <img src="images/set-chi-lam-vong-tay.jpg" id="main-img-16" alt="Sản phẩm">
                    <h3>Set chỉ cotton làm vòng tay DMC Flags Mouliné Thread Assortment </h3>
                    <p class="price">368.000đ</p>
                    <button id="btn-16" class="btn-buy" onclick="location.href='detail.html?id=16&color=default'">Xem chi tiết</button>
                </div>
                 <!-- Sản phẩm 17 -->
                  <div class="product-card">
                    <img src="images/hop-nhua.jpg" id="main-img-17" alt="Sản phẩm">
                    <h3>Hộp Nhựa 13cm * 6.5cm </h3>
                    <p class="price">26.000đ</p>
                    <button id="btn-17" class="btn-buy" onclick="location.href='detail.html?id=17&color=default'">Xem chi tiết</button>
                </div>
                <!-- Thêm các sản phẩm khác ở đây -->
            </div>
        </div>
    </main>

    <!-- Nạp Footer dùng chung -->
    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
