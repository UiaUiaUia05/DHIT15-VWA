<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng - Tiệm Len Handmade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container" style="margin-top: 50px;">
        <h2>Giỏ hàng của bạn</h2>
        <div id="cart-container">
            <!-- JavaScript sẽ đổ dữ liệu giỏ hàng vào đây -->
        </div>
        
        <div id="cart-summary" style="margin-top: 20px; text-align: right;">
            <h3>Tổng tiền: <span id="total-price">0đ</span></h3>
            <button class="btn-buy-now" style="width: 200px;">Thanh toán ngay</button>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    <script>
        window.onload = function() {
            renderCart();
        };

        function renderCart() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const container = document.getElementById('cart-container');
    
    // Nếu giỏ hàng trống, xóa bảng và reset tổng tiền về 0
    if (cart.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding: 50px;">
                <p>Giỏ hàng của bạn đang trống.</p>
                <a href="index.html" style="color: #d19275; text-decoration: none;">Tiếp tục mua sắm</a>
            </div>`;
        updateTotalPrice(0); // Cập nhật tiền về 0
        return;
    }

    let html = `
        <table style="width: 100%; border-collapse: collapse; background: #fff;">
            <tr style="background: #d19275; color: #fff;">
                <th style="padding: 15px;">Ảnh</th>
                <th>Sản phẩm</th>
                <th>Màu</th>
                <th>Số lượng</th>
                <th>Giá</th>
                <th>Xóa</th>
            </tr>
    `;

    cart.forEach((item, index) => {
        html += `
            <tr style="border-bottom: 1px solid #eee; text-align: center;">
                <td style="padding: 10px;"><img src="${item.image}" width="80" style="border-radius:5px;"></td>
                <td style="font-weight: bold;">${item.name}</td>
                <td>${item.color}</td>
                <td>${item.quantity}</td>
                <td style="color: #d19275; font-weight: bold;">${item.price}</td>
                <td>
                    <button onclick="removeItem(${index})" 
                            style="color: #ff4d4d; border:1px solid #ff4d4d; padding: 5px 10px; border-radius:5px; background:none; cursor:pointer; transition: 0.3s;">
                        Xóa
                    </button>
                </td>
            </tr>
        `;
    });

    html += "</table>";
    container.innerHTML = html;
    
    // Gọi hàm tính tổng tiền dựa trên danh sách hiện có
    calculateTotal(cart);
}

// Hàm xóa sản phẩm
function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    
    // Hiệu ứng xác nhận trước khi xóa (Tùy chọn)
    if(confirm("Bạn có chắc chắn muốn xóa sản phẩm này khỏi giỏ hàng?")) {
        cart.splice(index, 1); // Xóa phần tử tại vị trí index
        localStorage.setItem('cart', JSON.stringify(cart)); // Lưu lại vào kho
        renderCart(); // Vẽ lại giao diện và tự động cập nhật lại giá tiền
    }
}

// Hàm tính toán tổng tiền dựa trên mảng giỏ hàng
function calculateTotal(cart) {
    let total = 0;
    cart.forEach(item => {
        // Chuyển đổi giá từ chuỗi "88.000đ" sang số 88000
        const priceNum = parseInt(item.price.replace(/\D/g, ''));
        total += priceNum * item.quantity;
    });
    
    updateTotalPrice(total);
}

// Hàm hiển thị số tiền lên màn hình
function updateTotalPrice(amount) {
    const totalDisplay = document.getElementById('total-price');
    if (totalDisplay) {
        totalDisplay.innerText = amount.toLocaleString('vi-VN') + "đ";
    }
}
    </script>
</body>
</html>
