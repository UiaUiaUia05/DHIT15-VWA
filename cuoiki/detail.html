    <link rel="stylesheet" href="style.css">

<body> 
    <div id="header-placeholder"></div>

    <div class="content">
        <div class="container">
            <!-- Nút quay lại -->
        <div class="back-button-container">
            <button class="btn-back" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> ← Quay lại
            </button>
        </div>
            <div class="product-detail-container">
                <!-- Bên trái: Hình ảnh sản phẩm -->
                <div class="detail-image-section">
                    <img src="" id="main-detail-img" alt="Sản phẩm chính">
                </div>

                <!-- Bên phải: Thông tin sản phẩm -->
                <div class="detail-info-section">
                    <h1 id="detail-title">Tên sản phẩm</h1>
                    <p class="detail-price" id="detail-price">0đ</p>
                    
                    <div class="detail-description">
                        <h3>Mô tả sản phẩm:</h3>
                        <p id="detail-desc">Đang tải dữ liệu...</p>
                        <ul id="detail-specs">
                            <!-- Thông số kỹ thuật sẽ đổ vào đây -->
                        </ul>
                    </div>
                    <!-- Mục chọn size -->
                    <div class="size-selector">
                        <h3>Size khác:</h3>
                        <div class="size-options" id="detail-sizes">
                            <!-- Các nút size sẽ được JavaScript tự động đổ vào đây -->
                        </div>
                    </div>
                    <!-- Bộ chọn số lượng -->
                    <div class="quantity-selector">
                        <label>Số lượng:</label>
                        <div class="quantity-controls">
                            <button type="button" onclick="updateQty(-1)">-</button>
                            <input type="number" id="quantity" value="1" min="1">
                            <button type="button" onclick="updateQty(1)">+</button>
                        </div>
                    </div>

                    <!-- Nút hành động -->
                    <div class="action-buttons">
                        <button class="btn-add-cart" onclick="addToCart()">Thêm vào giỏ hàng</button>
                        <button class="btn-buy-now" onclick="buyNow()">Mua ngay</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    
    <!-- Link đến file script chung của bạn -->
    <script src="script.js"></script>

        window.onload = function() {
            // 1. Đọc tham số id và color từ URL
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const color = urlParams.get('color');

            if (id && productData[id]) {
                const product = productData[id];

                // 2. Cập nhật thông tin chữ
                document.getElementById('detail-title').innerText = product.name;
                document.getElementById('detail-price').innerText = product.price;
                document.getElementById('detail-desc').innerText = product.desc;
                document.title = product.name + " - Tiệm Len Handmade";

                // 3. Cập nhật danh sách thông số
                const specsList = document.getElementById('detail-specs');
                specsList.innerHTML = ""; // Xóa nội dung cũ
                product.specs.forEach(spec => {
                    let li = document.createElement('li');
                    li.innerText = spec;
                    specsList.appendChild(li);
                });

                // 4. Xử lý ảnh theo màu sắc
                const imgElement = document.getElementById('main-detail-img');
                if (color && product.images[color]) {
                    imgElement.src = product.images[color];
                } else {
                    // Nếu không chọn màu hoặc màu không tồn tại, lấy ảnh đầu tiên làm mặc định
                    imgElement.src = Object.values(product.images)[0];
                }
            } else {
                // Nếu không tìm thấy ID, hiển thị thông báo lỗi nhẹ
                document.getElementById('detail-desc').innerText = "Rất tiếc, không tìm thấy thông tin sản phẩm.";
            }
            // Biến toàn cục để lưu size đang chọn
        let selectedSize = "";

        function renderSizes(product) {
            const sizeContainer = document.getElementById('detail-sizes');
            if (!sizeContainer || !product.sizes) return;

            sizeContainer.innerHTML = ""; // Xóa dữ liệu cũ
            product.sizes.forEach((size, index) => {
                const btn = document.createElement('button');
                btn.innerText = size;
                btn.classList.add('size-btn');
                
                // Mặc định chọn size đầu tiên
                if (index === 0) {
                    btn.classList.add('active');
                    selectedSize = size;
                }

                btn.onclick = function() {
                    // Xóa active của tất cả các nút size khác
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                    // Thêm active cho nút vừa nhấn
                    btn.classList.add('active');
                    selectedSize = size;
                };
                
                sizeContainer.appendChild(btn);
            });
        }
        window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const product = productData[id];

    if (id && product) {
        // ... các code đổ tên, giá, ảnh ...

        // Xử lý hiển thị Size
        const sizeWrapper = document.querySelector('.size-selector'); // Vùng chứa tiêu đề "Size khác"
        
        if (product.sizes && product.sizes.length > 0) {
            // Nếu CÓ size: Hiện vùng chọn size và gọi hàm vẽ các nút
            sizeWrapper.style.display = "block";
            renderSizes(product);
        } else {
            // Nếu KHÔNG CÓ size: Ẩn hoàn toàn vùng này đi
            sizeWrapper.style.display = "none";
            selectedSize = ""; // Reset giá trị size về rỗng
        }
    }
};
        // Tìm đến phần hiển thị size trong detail.html
        const sizeWrapper = document.querySelector('.size-selector');
        const sizeContainer = document.getElementById('detail-sizes');

        if (product.sizes && product.sizes.length > 0) {
            // Nếu có size: Hiện vùng chọn size và vẽ các nút
            if (sizeWrapper) sizeWrapper.style.display = "block";
            renderSizes(product); 
        } else {
            // Nếu không có size: Ẩn hoàn toàn
            if (sizeWrapper) sizeWrapper.style.display = "none";
            selectedSize = ""; 
        }
