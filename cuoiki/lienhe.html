<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên hệ - Tiệm Len Handmade</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CĂN GIỮ TRANG TƯƠNG TỰ PROFILE */
        .contact-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            padding: 40px 20px;
            background-color: #fdfaf7;
        }

        .contact-box {
            background: white;
            width: 100%;
            max-width: 950px;
            display: flex;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border-top: 6px solid #d19275;
        }

        /* THÔNG TIN BÊN TRÁI */
        .contact-info {
            flex: 1;
            background-color: #d19275;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .contact-info h2 { margin-bottom: 10px; }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 16px;
        }

        /* FORM FEEDBACK BÊN PHẢI */
        .contact-form-area {
            flex: 1.5;
            padding: 40px;
        }

        .contact-form-area h2 {
            color: #333;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .form-group input, .form-group textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #d19275;
        }

        .btn-send {
            background-color: #d19275;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-send:hover {
            background-color: #b57a5d;
        }

        /* RESPONSIVE CHO DI ĐỘNG */
        @media (max-width: 768px) {
            .contact-box { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="contact-container">
        <div class="contact-box">
            <!-- CỘT TRÁI: THÔNG TIN -->
            <div class="contact-info">
                <h2>Liên hệ với chúng mình</h2>
                <p>Tiệm Len luôn sẵn sàng lắng nghe những ý kiến đóng góp và thắc mắc của bạn.</p>
                
                <div class="info-item">
                    <span>📍</span>
                    <span>Địa chỉ: 123 Đường Handmade, phường Đống Đa, Hà Nội</span>
                </div>
                <div class="info-item">
                    <span>📞</span>
                    <span>Số điện thoại: 0987 654 321</span>
                </div>
                <div class="info-item">
                    <span>✉️</span>
                    <span>Email: hieuphuong7b@gmail.com</span>
                </div>
            </div>

            <!-- CỘT PHẢI: FORM FEEDBACK -->
            <div class="contact-form-area">
                <h2>Gửi Feedback</h2>
                <form id="feedback-form">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" id="fb-name" placeholder="Nhập tên của bạn..." required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="fb-email" placeholder="Nhập email của bạn..." required>
                    </div>
                    <div class="form-group">
                        <label>Nội dung lời nhắn</label>
                        <textarea id="fb-message" rows="5" placeholder="Bạn muốn nhắn nhủ điều gì với Tiệm Len?" required></textarea>
                    </div>
                    <button type="submit" class="btn-send">GỬI LỜI NHẮN</button>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>
    <script>
        // Tự động điền tên và email nếu đã đăng nhập
        window.onload = function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                document.getElementById('fb-name').value = currentUser.user;
                document.getElementById('fb-email').value = currentUser.email;
            }
        };

        // Xử lý gửi form
        document.getElementById('feedback-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Cảm ơn feedback của bạn! Tiệm Len sẽ phản hồi sớm nhất qua email nhé.");
            this.reset(); // Xóa sạch form sau khi gửi
        });
    </script>
</body>
</html>
